<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño 2 - Sistema Información</title>
    <link rel="stylesheet" href="CSS/ESTILO.CSS">
</head>
<body>

    <nav>
        <a href="#">Menu1</a>
        <a href="#">Menu2</a>
        <a href="#">Menu3</a>
    </nav>

    <header>
        <h2>Sistema Informacion</h2>
    </header>

    <main>
        <aside class="izquierda">
            <a href="#">Opcion1</a>
            <a href="#">Opcion2</a>
            <a href="#">Opcion3</a>
        </aside>

        <section>
            <h1>Datos del Cliente</h1>
            <div class="formulario">
                <form>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Su nombre">

                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Su correo">

                    <label for="celular">Celular:</label>
                    <input type="tel" id="celular" placeholder="Su número">

                    <button type="submit">Enviar</button>
                </form>
            </div>
        </section>

        <aside class="derecha">
            <div class="fila">Producto1</div>
            <div class="fila">Promoción2</div>
            <div class="fila">Descuento3</div>
            <div class="relleno"></div>
        </aside>
    </main>

    <footer>
        <p>Su nombre y apellido</p>
    </footer>

</body>
</html>
